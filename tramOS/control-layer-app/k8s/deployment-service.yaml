apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-layer-app
  namespace: tramos
  labels:
    app: control-layer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: control-layer
  template:
    metadata:
      labels:
        app: control-layer
    spec:
      containers:
      - name: control-layer
        image: tramaachen/control-layer:latest
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: control-layer-service
  namespace: tramos
spec:
  selector:
    app: control-layer
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
